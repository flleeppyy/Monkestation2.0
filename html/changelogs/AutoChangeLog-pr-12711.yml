author: "Absolucy"
delete-after: True
changes:
  - rscadd: "Xenobiology is now literally slime rancher."
  - rscadd: "Slime vacuum packs now have built-in extract storage, upgradable with a matter bin."
  - rscadd: "Vacuum packs hold extracts now. shoot them into the fridge, dump them in a bag, or right-click to grab one."
  - rscadd: "Slime pens now actually look decent and have more space."
  - rscadd: "Crossbreeds are now made with an \"extract compressor\", which consumes both biomass and slime extracts."
  - rscadd: "Slime scanners are now used to remotely scan a slime and stay up to date on that specific slime's stats and such."
  - rscadd: "Instead of mulching slimes for extracts, slimes now produce extracts when fed enough."
  - rscadd: "Slimes won't split on their own - instead, you need to feed them \"breeding pellets\" from the biomass recycler, or if you are the slime's friend, order them to do so, and they will split or mutate whenever they can instead. This does not apply to \"wild\" slimes that haven't been in a pen recently, and player slimes can still manually split whenever."
  - rscadd: "Catslimes now harmlessly boop people nearby :3"
  - rscadd: "Cleaner slimes go wander off to look for messes when there's nothing nearby, and sometimes go find a random player"
  - rscadd: "Cleaner slimes (and slimes you've sicced on something) can use stairs now"
  - bugfix: "Mobs no longer freeze up after changing floors until someone walks up to them"